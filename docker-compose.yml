services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      start_period: 20s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    depends_on:
      - kafka

    ports:
      - "8081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # api / worker run only with: docker compose --profile app up -d --build
  api:
    build: .
    container_name: cisco-api
    profiles: ["app"]

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      KAFKA_BOOTSTRAP: kafka:9092

    restart: unless-stopped

  worker:
    build: .
    container_name: cisco-worker
    profiles: ["app"]
    command: ["python", "worker.py"]

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ROUTER_USERNAME: ${ROUTER_USERNAME:-admin}
      ROUTER_PASSWORD: ${ROUTER_PASSWORD:-cisco}

    restart: unless-stopped

volumes:
  kafka_data:
